<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Log de Treino</title>
<style>
  :root{
    --bg:#0b1424;
    --panel:#111c30;
    --panel-2:#16233b;
    --panel-3:#1b2a47;
    --line:#233252;
    --text:#eef1f6;
    --sub:#8fa0bd;
    --accent:#1e9e6b;
    --accent-ink:#07140d;
    --ok:#2fbf71;
    --danger:#e0637d;
    --scrim:rgba(4,9,20,0.62);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  .wrap{max-width:520px; margin:0 auto; padding:16px 14px 90px;}
  header{padding:6px 2px 14px;}
  .kicker{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:700;}
  h1{font-size:22px; margin:4px 0 0; font-weight:800;}
  .tabs{display:flex; gap:6px; margin:16px 0 14px; overflow-x:auto;}
  .tab{flex:1; text-align:center; padding:10px 6px; border-radius:10px; background:var(--panel);
    border:1px solid var(--line); font-size:13px; font-weight:700; color:var(--sub); cursor:pointer; white-space:nowrap;}
  .tab.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .datebar{display:flex; align-items:center; justify-content:space-between; background:var(--panel);
    border:1px solid var(--line); border-radius:12px; padding:10px 14px; margin-bottom:14px;}
  .datebar input{background:transparent; border:none; color:var(--text); font-size:15px; font-weight:700; font-family:inherit;}
  .datebar label{font-size:11px; color:var(--sub); text-transform:uppercase; letter-spacing:.08em; display:block; margin-bottom:2px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px;}
  .ex-name{font-size:15px; font-weight:800; margin:0 0 2px;}
  .ex-scheme{font-size:12px; color:var(--sub); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; margin-bottom:10px;}
  .row{display:flex; gap:8px;}
  .field{flex:1;}
  .field label{font-size:10px; color:var(--sub); text-transform:uppercase; letter-spacing:.06em; display:block; margin-bottom:4px;}
  .field input{width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:9px;
    color:var(--text); font-size:17px; font-weight:700; padding:10px 10px; font-family:inherit;}
  .field input:focus{outline:none; border-color:var(--accent);}
  .hist{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); font-size:12px; color:var(--sub);
    display:flex; gap:10px; flex-wrap:wrap;}
  .hist b{color:var(--text);}
  .savebar{position:fixed; left:0; right:0; bottom:0; padding:12px 14px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--bg) 60%, transparent);}
  .savebtn{max-width:520px; margin:0 auto; display:block; width:100%; background:var(--accent); color:var(--accent-ink);
    border:none; border-radius:14px; padding:15px; font-size:15px; font-weight:800;}
  .savebtn.saved{background:var(--ok);}
  .toast{position:fixed; top:14px; left:50%; transform:translateX(-50%); background:var(--panel-2);
    border:1px solid var(--line); padding:8px 16px; border-radius:20px; font-size:13px; opacity:0; transition:opacity .25s; pointer-events:none;}
  .toast.show{opacity:1;}
  .reset{text-align:center; margin-top:18px;}
  .reset button{background:none; border:none; color:var(--sub); font-size:12px; text-decoration:underline;}
  .empty{font-size:12px; color:var(--sub); text-align:center; padding:6px;}
  .backup{display:flex; gap:10px; justify-content:center; margin-top:10px; flex-wrap:wrap;}
  .backup button{background:var(--panel); border:1px solid var(--line); color:var(--sub);
    font-size:12px; font-weight:700; padding:8px 14px; border-radius:10px;}
  .ultimo{font-size:12.5px; font-weight:700; color:var(--accent); margin:2px 0 10px;}
  .ultimo b{font-weight:800;}
  .ex-name-btn{display:block; width:100%; text-align:left; background:none; border:none; padding:0;
    font:inherit; font-size:15px; font-weight:800; color:inherit; margin:0 0 2px; cursor:pointer;}
  .ex-name-input{display:block; width:100%; font-size:15px; font-weight:800; margin:0 0 2px;
    background:var(--panel-2); border:1px solid var(--accent); border-radius:6px;
    color:var(--text); padding:2px 6px; font-family:inherit;}

  header.hdr-row{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .gear-btn{
    background:var(--panel); border:1px solid var(--line); color:var(--sub);
    width:38px; height:38px; border-radius:11px; font-size:16px; cursor:pointer; flex:none; margin-top:2px;
  }

  header.top{ padding:6px 2px 16px; }
  .back{
    display:inline-flex; align-items:center; gap:4px; margin-bottom:14px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:9px;
    color:var(--accent); font-size:14px; font-weight:700;
    padding:8px 12px 8px 8px; cursor:pointer;
  }
  .back::before{ content:'‹'; font-size:18px; line-height:1; }

  /* ---- Configuração: lista de dias ---- */
  .day-row{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:12px 14px; margin-bottom:10px; display:flex; align-items:center; gap:12px;
    transition:opacity .15s;
  }
  .day-row.inativo{ opacity:.55; }
  .toggle{
    width:46px; height:28px; border-radius:16px; background:var(--panel-3); border:1px solid var(--line);
    position:relative; flex:none; cursor:pointer; padding:0;
  }
  .toggle .knob{
    position:absolute; top:2px; left:2px; width:22px; height:22px; border-radius:50%;
    background:var(--sub); transition:transform .18s ease, background .18s ease;
  }
  .toggle.on{ background:var(--accent); border-color:var(--accent); }
  .toggle.on .knob{ transform:translateX(18px); background:var(--accent-ink); }

  .day-main{ flex:1; min-width:0; text-align:left; background:none; border:none; padding:0; color:inherit; font:inherit; }
  .day-main:disabled{ cursor:default; }
  .day-name{ font-size:15px; font-weight:800; }
  .day-sub{ font-size:12.5px; color:var(--sub); margin-top:2px; }
  .day-sub.set{ color:var(--accent); font-weight:700; }
  .day-count{ font-size:11px; color:var(--sub); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; margin-top:3px; }
  .chev{ color:var(--sub); font-size:18px; flex:none; }

  /* ---- Configuração: editor do dia ---- */
  .field-block{ margin-bottom:16px; }
  .field-block label{ font-size:11px; color:var(--sub); text-transform:uppercase; letter-spacing:.06em; display:block; margin-bottom:6px; }
  .field-block input[type=text]{
    width:100%; background:var(--panel); border:1px solid var(--line); border-radius:11px;
    color:var(--text); font-size:16px; font-weight:700; padding:12px 12px; font-family:inherit;
  }
  .field-block input:focus{ outline:none; border-color:var(--accent); }

  .ex-row{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:12px; margin-bottom:10px; display:flex; align-items:center; gap:10px;
  }
  .reorder{ display:flex; flex-direction:column; gap:3px; flex:none; }
  .reorder button{
    width:32px; height:26px; background:var(--panel-2); border:1px solid var(--line); border-radius:7px;
    color:var(--sub); font-size:13px; line-height:1; cursor:pointer;
  }
  .reorder button:disabled{ opacity:.3; }
  .ex-info{ flex:1; min-width:0; }
  .ex-info .ex-name{ font-size:14.5px; }
  .ex-info .ex-scheme{ margin-bottom:0; }
  .ex-actions{ display:flex; gap:6px; flex:none; }
  .icon-btn{
    width:34px; height:34px; border-radius:9px; border:1px solid var(--line); background:var(--panel-2);
    color:var(--sub); font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .icon-btn.danger{ color:var(--danger); }

  .add-btn{
    width:100%; background:var(--panel-2); border:1px dashed var(--line); color:var(--accent);
    font-size:14px; font-weight:800; padding:14px; border-radius:12px; cursor:pointer; margin-top:4px;
  }
  .empty-day{ font-size:13px; color:var(--sub); text-align:center; padding:30px 10px; }

  /* ---- Sheet (adicionar/editar exercício) ---- */
  .sheet-scrim{
    position:fixed; inset:0; background:var(--scrim); display:none; z-index:30;
  }
  .sheet-scrim.show{ display:block; animation:fade .18s ease; }
  @keyframes fade{ from{opacity:0} to{opacity:1} }
  .sheet{
    position:fixed; left:0; right:0; bottom:0; max-height:88%; max-width:520px; margin:0 auto; background:var(--panel);
    border-top:1px solid var(--line); border-radius:20px 20px 0 0; padding:10px 18px calc(20px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; transform:translateY(100%); transition:transform .25s ease;
    box-shadow:0 -20px 50px -20px rgba(0,0,0,.6);
  }
  .sheet-scrim.show .sheet{ transform:translateY(0); }
  @media (prefers-reduced-motion: reduce){ .sheet{ transition:none; } }
  .grabber{ width:36px; height:4px; background:var(--line); border-radius:3px; margin:2px auto 12px; }
  .sheet h2{ font-size:16px; margin:0 0 2px; font-weight:800; }
  .sheet .subtitle{ margin-bottom:14px; }
  .sheet-body{ overflow-y:auto; }

  .search input{
    width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:11px;
    color:var(--text); font-size:15px; padding:11px 12px; font-family:inherit; margin-bottom:10px;
  }
  .search input:focus{ outline:none; border-color:var(--accent); }
  .catalogo-list{ display:flex; flex-direction:column; gap:6px; }
  .cat-item{
    background:var(--panel-2); border:1px solid var(--line); border-radius:11px; padding:12px 14px;
    font-size:14.5px; font-weight:700; cursor:pointer; text-align:left; color:var(--text);
  }
  .cat-item:active{ border-color:var(--accent); }
  .cat-new{
    background:var(--panel-2); border:1px dashed var(--accent); color:var(--accent);
    border-radius:11px; padding:12px 14px; font-size:14px; font-weight:800; cursor:pointer; text-align:left; margin-bottom:10px;
  }
  .cat-empty{ font-size:13px; color:var(--sub); text-align:center; padding:18px 0; }

  .vinculo-nota{ font-size:12px; color:var(--sub); margin:-8px 0 14px; }
  .vinculo-nota.novo{ color:var(--ok); }

  .stepper-control{ display:flex; align-items:stretch; background:var(--panel-2); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .stepper-control button{ width:44px; border:none; background:none; color:var(--accent); font-size:19px; font-weight:800; cursor:pointer; }
  .stepper-control input{
    flex:1; min-width:0; text-align:center; background:none; border:none; color:var(--text);
    font-size:16px; font-weight:800; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  .stepper-control input:focus{ outline:none; }
  .reps-max-link{
    background:none; border:none; color:var(--accent); font-size:11.5px; font-weight:700;
    padding:6px 0 0; cursor:pointer; text-decoration:underline;
  }

  .sheet-actions{ display:flex; gap:10px; margin-top:18px; }
  .btn{ flex:1; padding:14px; border-radius:12px; font-size:14.5px; font-weight:800; border:none; cursor:pointer; }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-secondary{ background:var(--panel-2); color:var(--sub); border:1px solid var(--line); }
  .btn-danger{ background:var(--danger); color:#2b0410; }

  /* ---- Modal de confirmação ---- */
  .confirm-scrim{
    position:fixed; inset:0; background:var(--scrim); display:none;
    align-items:center; justify-content:center; padding:24px; z-index:40;
  }
  .confirm-scrim.show{ display:flex; animation:fade .15s ease; }
  .confirm-card{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:20px; width:100%; max-width:320px;
  }
  .confirm-card p{ font-size:14.5px; font-weight:600; line-height:1.5; margin:0 0 18px; }

  /* ---- Cores personalizadas ---- */
  .color-row{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:12px 14px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .color-row label{ font-size:14px; font-weight:700; }
  .color-row input[type=color]{
    width:56px; height:40px; border:1px solid var(--line); border-radius:9px; background:var(--panel-2);
    padding:2px; cursor:pointer;
  }
  .aviso-contraste{ font-size:12.5px; color:var(--danger); padding:4px 2px 10px; }
</style>
</head>
<body>
<div class="wrap" id="tela-treino">
  <header class="hdr-row">
    <div>
      <div class="kicker">Log de treino</div>
      <h1 id="dayTitle">Segunda</h1>
    </div>
    <button class="gear-btn" aria-label="Configurar treino" onclick="abrirConfiguracao()">⚙</button>
  </header>

  <div class="tabs" id="tabs"></div>

  <div class="datebar">
    <div>
      <label>Data do treino</label>
      <input type="date" id="dateInput">
    </div>
  </div>

  <div id="cards"></div>

  <div class="reset">
    <button onclick="resetDay()">Limpar campos desta tela</button>
  </div>

  <div class="backup">
    <button onclick="exportData()">Exportar dados</button>
    <button onclick="document.getElementById('importFile').click()">Importar dados</button>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="importData(event)">
  </div>
</div>

<div class="wrap" id="tela-config-dias" style="display:none">
  <header class="top">
    <button class="back" onclick="voltarParaTreino()">Treino</button>
    <div class="kicker">Configuração</div>
    <h1>Seu treino</h1>
    <div class="subtitle">Ative os dias que têm treino e dê um nome pra cada um</div>
  </header>
  <div id="lista-dias-config"></div>
  <div class="reset" style="margin-top:20px;">
    <button onclick="abrirCores()">🎨 Personalizar cores</button>
  </div>
</div>

<div class="wrap" id="tela-config-dia" style="display:none">
  <header class="top">
    <button class="back" onclick="voltarParaConfigDias()">Configuração</button>
    <div class="kicker" id="cfg-dia-kicker">Segunda-feira</div>
    <h1 id="cfg-dia-titulo">Segunda</h1>
  </header>
  <div class="field-block">
    <label>Nome do treino</label>
    <input type="text" id="input-nome-dia" placeholder="ex: Costas e Bíceps" oninput="onNomeDiaChange(this.value)">
  </div>
  <div id="lista-exercicios-config"></div>
  <button class="add-btn" onclick="abrirSheetNovo()">+ Adicionar exercício</button>
</div>

<div class="wrap" id="tela-cores" style="display:none">
  <header class="top">
    <button class="back" onclick="mostrarTela('tela-config-dias')">Configuração</button>
    <div class="kicker">Aparência</div>
    <h1>Cores do app</h1>
    <div class="subtitle">Escolha 3 cores; o resto se ajusta sozinho para continuar legível</div>
  </header>

  <div class="color-row">
    <label>Fundo</label>
    <input type="color" id="cor-fundo" oninput="onCorChange()">
  </div>
  <div class="color-row">
    <label>Destaque (botões)</label>
    <input type="color" id="cor-destaque" oninput="onCorChange()">
  </div>
  <div class="color-row">
    <label>Texto</label>
    <input type="color" id="cor-texto" oninput="onCorChange()">
  </div>
  <div class="aviso-contraste" id="aviso-contraste" style="display:none;"></div>

  <button class="add-btn" onclick="restaurarCoresPadrao()" style="margin-top:10px;">Restaurar padrão</button>
</div>

<div class="sheet-scrim" id="sheet-scrim">
  <div class="sheet" id="sheet">
    <div class="grabber"></div>
    <div id="sheet-conteudo"></div>
  </div>
</div>

<div class="confirm-scrim" id="confirm-scrim">
  <div class="confirm-card">
    <p id="confirm-msg"></p>
    <div class="sheet-actions" style="margin-top:0;">
      <button class="btn btn-secondary" onclick="fecharConfirm()">Cancelar</button>
      <button class="btn btn-danger" id="confirm-ok-btn">Excluir</button>
    </div>
  </div>
</div>

<div class="savebar" id="savebar">
  <button class="savebtn" id="saveBtn" onclick="saveSession()">Salvar treino de hoje</button>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEYS = { exercicios:'treino_exercicios', plano:'treino_plano', logs:'treino_logs', migrado:'treino_migrado_v2' };
const STORAGE_CORES = 'treino_cores';

const ORDEM_DIAS = [
  { key:'dom', label:'Domingo' }, { key:'seg', label:'Segunda' }, { key:'ter', label:'Terça' },
  { key:'qua', label:'Quarta' }, { key:'qui', label:'Quinta' }, { key:'sex', label:'Sexta' }, { key:'sab', label:'Sábado' }
];

const CORES_PADRAO = { fundo:'#0b1424', destaque:'#1e9e6b', texto:'#eef1f6' };
const TOKENS_PADRAO = {
  bg:'#0b1424', panel:'#111c30', 'panel-2':'#16233b', 'panel-3':'#1b2a47', line:'#233252',
  text:'#eef1f6', sub:'#8fa0bd', accent:'#1e9e6b', 'accent-ink':'#07140d', ok:'#2fbf71', danger:'#e0637d'
};

// Usado só como ponto de partida da migração automática (Etapa 2a). Depois da
// migração, a fonte de verdade passa a ser STORAGE_KEYS.plano/.exercicios no localStorage.
const DIAS_SEED_MIGRACAO = [
  { key:'seg', label:'Segunda', exercises:[
    {name:'Remada curvada', scheme:'4 x 8'},
    {name:'Serrote', scheme:'3 x 10'},
    {name:'Face pull', scheme:'3 x 10'},
    {name:'Rosca direta Scott', scheme:'3 x 10'},
    {name:'Rosca unilateral polia baixa', scheme:'2 x 12'},
  ]},
  { key:'ter', label:'Terça', exercises:[
    {name:'Supino inclinado halteres', scheme:'3 x 8'},
    {name:'Peck deck', scheme:'3 x 12'},
    {name:'Desenvolvimento halteres', scheme:'3 x 8'},
    {name:'Elevação lateral', scheme:'3 x 15'},
    {name:'Tríceps cordinha', scheme:'4 x 12'},
  ]},
  { key:'qui', label:'Quinta', exercises:[
    {name:'Agachamento livre', scheme:'3 x 8'},
    {name:'Cadeira extensora unilateral', scheme:'3 x 12'},
    {name:'Stiff barra', scheme:'3 x 10'},
    {name:'Cadeira flexora unilateral em pé', scheme:'2 x 12'},
    {name:'Panturrilha em pé', scheme:'3 x 15'},
  ]},
  { key:'sex', label:'Sexta', exercises:[
    {name:'Barra fixa', scheme:'3 x máx'},
    {name:'Pull down', scheme:'2 x 10'},
    {name:'Posterior de ombro no cross', scheme:'3 x 12'},
    {name:'Elevação lateral (ângulo dif.)', scheme:'3 x 10'},
    {name:'Rosca martelo', scheme:'3 x 10'},
    {name:'Tríceps testa', scheme:'3 x 10'},
  ]},
];

let currentDayIdx = 0;

function todayISO(){
  const d = new Date();
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off*60000);
  return local.toISOString().slice(0,10);
}

function formatarData(iso){
  const [y,m,d] = iso.split('-');
  return `${d}/${m}`;
}

function generateId(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,10);
}

function getExercicios(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEYS.exercicios)) || []; }catch(e){ return []; }
}
function getPlano(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEYS.plano)) || { dias: [] }; }catch(e){ return { dias: [] }; }
}
function getLogs(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEYS.logs)) || []; }catch(e){ return []; }
}
function salvarLogs(logs){ localStorage.setItem(STORAGE_KEYS.logs, JSON.stringify(logs)); }
function nomeDoExercicio(exercicioId, exercicios){
  const ex = exercicios.find(e => e.id === exercicioId);
  return ex ? ex.nome : '(exercício removido)';
}
function renomearExercicio(exercicioId, novoNome){
  const exercicios = getExercicios();
  const ex = exercicios.find(e => e.id === exercicioId);
  if(ex){
    ex.nome = novoNome;
    localStorage.setItem(STORAGE_KEYS.exercicios, JSON.stringify(exercicios));
  }
}

function editarNomeExercicioInline(botao, exercicioId){
  const nomeAtual = botao.textContent;
  let cancelado = false;
  const input = document.createElement('input');
  input.type = 'text';
  input.value = nomeAtual;
  input.className = 'ex-name-input';
  botao.replaceWith(input);
  input.focus();
  input.select();
  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') input.blur();
    if(e.key === 'Escape'){ cancelado = true; input.blur(); }
  });
  input.addEventListener('blur', () => {
    if(!cancelado){
      const novoNome = input.value.trim();
      if(novoNome && novoNome !== nomeAtual){
        renomearExercicio(exercicioId, novoNome);
        showToast('Nome atualizado');
      }
    }
    renderCards();
  });
}

function garantirExercicioPorNome(nome, exercicios){
  let ex = exercicios.find(e => e.nome === nome);
  if(!ex){
    ex = { id: generateId(), nome };
    exercicios.push(ex);
  }
  return ex.id;
}
function parseScheme(scheme){
  const m = /^(\d+)\s*x\s*(.+)$/i.exec(scheme || '');
  if(!m) return { series:null, reps: scheme || null, descanso:null };
  return { series: parseInt(m[1],10), reps: m[2].trim(), descanso:null };
}

function diasAtivos(){
  return getPlano().dias.filter(d => d.ativo);
}

function salvarPlano(plano){
  localStorage.setItem(STORAGE_KEYS.plano, JSON.stringify(plano));
}

function garantirPlanoAtualizado(){
  const plano = getPlano();
  const existentes = {};
  (plano.dias || []).forEach(d => { existentes[d.key] = d; });
  let mudou = (plano.dias || []).length !== ORDEM_DIAS.length;

  const dias = ORDEM_DIAS.map(({key,label}) => {
    const atual = existentes[key];
    if(!atual){
      mudou = true;
      return { key, label, ativo:false, nome:'', exercicios:[] };
    }
    if(atual.ativo === undefined) mudou = true;
    const exercicios = (atual.exercicios || []).map(item => {
      if(!item.itemId){ mudou = true; return { ...item, itemId: generateId() }; }
      return item;
    });
    return {
      key, label,
      ativo: atual.ativo !== undefined ? atual.ativo : true,
      nome: atual.nome || '',
      exercicios
    };
  });

  if(mudou) salvarPlano({ dias });
}

/* ---------- Cores personalizadas ---------- */
function hexParaRgb(hex){
  const n = parseInt(hex.replace('#',''), 16);
  return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
}
function rgbParaHex(r,g,b){
  return '#' + [r,g,b].map(v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
}
function hexParaHsl(hex){
  const { r:r0, g:g0, b:b0 } = hexParaRgb(hex);
  const r=r0/255, g=g0/255, b=b0/255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b);
  let h=0, s=0; const l=(max+min)/2;
  if(max !== min){
    const d = max-min;
    s = l>0.5 ? d/(2-max-min) : d/(max+min);
    switch(max){
      case r: h=(g-b)/d+(g<b?6:0); break;
      case g: h=(b-r)/d+2; break;
      default: h=(r-g)/d+4;
    }
    h*=60;
  }
  return { h, s:s*100, l:l*100 };
}
function hslParaHex(h,s,l){
  s/=100; l/=100;
  const c=(1-Math.abs(2*l-1))*s;
  const x=c*(1-Math.abs((h/60)%2-1));
  const m=l-c/2;
  let r,g,b;
  if(h<60){r=c;g=x;b=0;} else if(h<120){r=x;g=c;b=0;} else if(h<180){r=0;g=c;b=x;}
  else if(h<240){r=0;g=x;b=c;} else if(h<300){r=x;g=0;b=c;} else {r=c;g=0;b=x;}
  return rgbParaHex((r+m)*255,(g+m)*255,(b+m)*255);
}
function ajustarLuminosidade(hex, delta){
  const {h,s,l} = hexParaHsl(hex);
  const dir = l > 50 ? -1 : 1;
  return hslParaHex(h, s, Math.max(0, Math.min(100, l + delta*dir)));
}
function misturarCores(hexA, hexB, pesoA){
  const a = hexParaRgb(hexA), b = hexParaRgb(hexB);
  return rgbParaHex(
    a.r*pesoA + b.r*(1-pesoA),
    a.g*pesoA + b.g*(1-pesoA),
    a.b*pesoA + b.b*(1-pesoA)
  );
}
function luminanciaAprox(hex){
  const {r,g,b} = hexParaRgb(hex);
  return (0.299*r + 0.587*g + 0.114*b) / 255;
}

function tokensDerivados(cores){
  const fundoClaro = hexParaHsl(cores.fundo).l > 50;
  return {
    bg: cores.fundo,
    text: cores.texto,
    accent: cores.destaque,
    panel: ajustarLuminosidade(cores.fundo, 6),
    'panel-2': ajustarLuminosidade(cores.fundo, 11),
    'panel-3': ajustarLuminosidade(cores.fundo, 14),
    line: ajustarLuminosidade(cores.fundo, 18),
    sub: misturarCores(cores.texto, cores.fundo, 0.55),
    'accent-ink': luminanciaAprox(cores.destaque) > 0.55 ? '#0a0a0a' : '#f5f5f5',
    ok: fundoClaro ? '#1a8f57' : '#2fbf71',
    danger: fundoClaro ? '#c23558' : '#e0637d'
  };
}

function aplicarTokens(tokens){
  const root = document.documentElement.style;
  Object.keys(tokens).forEach(k => root.setProperty('--'+k, tokens[k]));
}

function getCores(){
  try{
    const salvo = JSON.parse(localStorage.getItem(STORAGE_CORES));
    return salvo ? { ...CORES_PADRAO, ...salvo } : null;
  }catch(e){ return null; }
}

function aplicarCoresAtuais(){
  const cores = getCores();
  aplicarTokens(cores ? tokensDerivados(cores) : TOKENS_PADRAO);
}

function carregarCoresNaTela(){
  const cores = getCores() || CORES_PADRAO;
  document.getElementById('cor-fundo').value = cores.fundo;
  document.getElementById('cor-destaque').value = cores.destaque;
  document.getElementById('cor-texto').value = cores.texto;
  atualizarAvisoContraste(cores);
}

function atualizarAvisoContraste(cores){
  const aviso = document.getElementById('aviso-contraste');
  const diff = Math.abs(luminanciaAprox(cores.texto) - luminanciaAprox(cores.fundo));
  if(diff < 0.35){
    aviso.style.display = '';
    aviso.textContent = 'Contraste baixo entre texto e fundo — pode ficar difícil de ler.';
  } else {
    aviso.style.display = 'none';
  }
}

function onCorChange(){
  const cores = {
    fundo: document.getElementById('cor-fundo').value,
    destaque: document.getElementById('cor-destaque').value,
    texto: document.getElementById('cor-texto').value
  };
  localStorage.setItem(STORAGE_CORES, JSON.stringify(cores));
  aplicarTokens(tokensDerivados(cores));
  atualizarAvisoContraste(cores);
}

function restaurarCoresPadrao(){
  localStorage.removeItem(STORAGE_CORES);
  aplicarTokens(TOKENS_PADRAO);
  carregarCoresNaTela();

}

function migrarDadosAntigos(){
  if(localStorage.getItem(STORAGE_KEYS.migrado)) return;

  const exercicios = [];

  const dias = DIAS_SEED_MIGRACAO.map(d => ({
    key: d.key,
    label: d.label,
    exercicios: d.exercises.map(ex => {
      const exercicioId = garantirExercicioPorNome(ex.name, exercicios);
      const parsed = parseScheme(ex.scheme);
      return { exercicioId, series: parsed.series, reps: parsed.reps, descanso: parsed.descanso };
    })
  }));

  const logs = [];
  Object.keys(localStorage).forEach(k=>{
    const m = /^session_([a-z]+)_(\d{4}-\d{2}-\d{2})$/.exec(k);
    if(!m) return;
    const data = m[2];
    try{
      const registro = JSON.parse(localStorage.getItem(k));
      Object.keys(registro).forEach(nome=>{
        const val = registro[nome];
        if(!val || (!val.peso && !val.reps)) return;
        const exercicioId = garantirExercicioPorNome(nome, exercicios);
        logs.push({ id: generateId(), data, exercicioId, peso: val.peso || null, reps: val.reps || null });
      });
    }catch(e){}
  });

  localStorage.setItem(STORAGE_KEYS.exercicios, JSON.stringify(exercicios));
  localStorage.setItem(STORAGE_KEYS.plano, JSON.stringify({ dias }));
  localStorage.setItem(STORAGE_KEYS.logs, JSON.stringify(logs));
  localStorage.setItem(STORAGE_KEYS.migrado, '1');
}

function renderTabs(){

}

function renderCards(){
  const dias = diasAtivos();
  const exercicios = getExercicios();
  const logs = getLogs();
  const day = dias[currentDayIdx];
  const container = document.getElementById('cards');

  if(!day){
    document.getElementById('dayTitle').textContent = 'Nenhum treino configurado';
    container.innerHTML = '<div class="empty">Toque em ⚙ para configurar seus dias de treino.</div>';
    return;
  }

  document.getElementById('dayTitle').textContent = day.nome || day.label;
  container.innerHTML = '';

  day.exercicios.forEach((item, idx)=>{
    const nome = nomeDoExercicio(item.exercicioId, exercicios);
    const historico = logs
      .filter(l => l.exercicioId === item.exercicioId && l.peso)
      .sort((a,b) => b.data.localeCompare(a.data));
    const ultimo = historico[0];
    const anteriores = historico.slice(1, 4);
    const schemeTxt = `${item.series ?? '?'} x ${item.reps ?? '?'}` + (item.descanso ? ` · descanso ${item.descanso}` : '');

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <button class="ex-name-btn" onclick="editarNomeExercicioInline(this, '${item.exercicioId}')">${nome}</button>
      <p class="ex-scheme">${schemeTxt}</p>
      ${ultimo ? `<div class="ultimo">Último: <b>${ultimo.peso}kg</b> (${formatarData(ultimo.data)})</div>` : ''}
      <div class="row">
        <div class="field">
          <label>Peso (kg)</label>
          <input type="number" inputmode="decimal" step="0.5" id="peso_${idx}" placeholder="—">
        </div>
        <div class="field">
          <label>Reps feitas</label>
          <input type="number" inputmode="numeric" id="reps_${idx}" placeholder="—">
        </div>
      </div>
      ${anteriores.length ? `<div class="hist">${anteriores.map(h=>`<span><b>${h.peso}kg</b> em ${formatarData(h.data)}</span>`).join('')}</div>` : ''}
    `;
    container.appendChild(card);
  });

  loadExistingForDate();
}

function loadExistingForDate(){
  const day = diasAtivos()[currentDayIdx];
  if(!day) return;
  const date = document.getElementById('dateInput').value;
  const logs = getLogs();
  day.exercicios.forEach((item, idx)=>{
    const registro = logs.find(l => l.exercicioId === item.exercicioId && l.data === date);
    const pesoEl = document.getElementById(`peso_${idx}`);
    const repsEl = document.getElementById(`reps_${idx}`);
    if(pesoEl) pesoEl.value = registro && registro.peso ? registro.peso : '';
    if(repsEl) repsEl.value = registro && registro.reps ? registro.reps : '';
  });
}

function saveSession(){
  const day = diasAtivos()[currentDayIdx];
  const date = document.getElementById('dateInput').value;
  if(!date){ showToast('Escolha uma data primeiro'); return; }
  if(!day) return;
  const btn = document.getElementById('saveBtn');
  try{
    let logs = getLogs();
    day.exercicios.forEach((item, idx)=>{
      const peso = document.getElementById(`peso_${idx}`).value;
      const reps = document.getElementById(`reps_${idx}`).value;
      const existenteIdx = logs.findIndex(l => l.exercicioId === item.exercicioId && l.data === date);
      if(!peso && !reps){
        if(existenteIdx !== -1) logs.splice(existenteIdx, 1);
        return;
      }
      const registro = { id: existenteIdx !== -1 ? logs[existenteIdx].id : generateId(), data:date, exercicioId:item.exercicioId, peso: peso || null, reps: reps || null };
      if(existenteIdx !== -1) logs[existenteIdx] = registro; else logs.push(registro);
    });
    salvarLogs(logs);
    btn.textContent = 'Salvo ✓';
    btn.classList.add('saved');
    showToast('Treino salvo');
    setTimeout(()=>{ btn.textContent = 'Salvar treino de hoje'; btn.classList.remove('saved'); renderCards(); }, 1200);
  }catch(e){
    showToast('Erro ao salvar');
  }
}

function resetDay(){
  const day = diasAtivos()[currentDayIdx];
  if(!day) return;
  day.exercicios.forEach((item, idx)=>{
    document.getElementById(`peso_${idx}`).value = '';
    document.getElementById(`reps_${idx}`).value = '';
  });
}

function moverExercicioConfig(itemId, dir){
  const plano = getPlano();
  const d = plano.dias.find(x=>x.key===diaConfigKey);
  const i = d.exercicios.findIndex(x=>x.itemId===itemId);
  const j = i + dir;
  if(j < 0 || j >= d.exercicios.length) return;
  [d.exercicios[i], d.exercicios[j]] = [d.exercicios[j], d.exercicios[i]];
  salvarPlano(plano);
  renderConfigDia();
}

function removerExercicioConfig(itemId){
  const plano = getPlano();
  const d = plano.dias.find(x=>x.key===diaConfigKey);
  const nome = nomeDoExercicio(d.exercicios.find(x=>x.itemId===itemId).exercicioId, getExercicios());
  pedirConfirmacao(`Excluir "${nome}" deste dia? O histórico dele não é apagado.`, () => {
    d.exercicios = d.exercicios.filter(x=>x.itemId!==itemId);
    salvarPlano(plano);
    renderConfigDia();
    showToast('Exercício removido do dia');
  });
}

function filtrarCatalogo(termo){ renderCatalogo(termo); }

function renderCatalogo(termo){
  const list = document.getElementById('catalogo-list');
  const t = termo.trim().toLowerCase();
  const resultados = getExercicios().filter(e => e.nome.toLowerCase().includes(t));
  if(resultados.length === 0){
    list.innerHTML = '<div class="cat-empty">Nenhum exercício encontrado no catálogo.</div>';
    return;
  }
  list.innerHTML = resultados.map(e =>
    `<button class="cat-item" onclick="escolherDoCatalogo('${e.id}')">${e.nome}</button>`
  ).join('');
}

function escolherDoCatalogo(exercicioId){
  const ex = getExercicios().find(e=>e.id===exercicioId);
  sheet = { ...sheet, passo:'detalhes', exercicioId:ex.id, nome:ex.nome, novoExercicio:false, series:3, reps:'10', descanso:60 };
  renderSheet();
}

function irParaNovoNome(){
  const busca = document.getElementById('busca-exercicio');
  const nomeSugerido = (busca && busca.value.trim()) || '';
  sheet = { ...sheet, passo:'novo-nome', nomeSugerido };
  renderSheet();
}

function confirmarNovoNome(){
  const nome = document.getElementById('input-novo-nome').value.trim();
  if(!nome){ showToast('Digite um nome para o exercício'); return; }
  sheet = { ...sheet, passo:'detalhes', exercicioId:null, nome, novoExercicio:true, series:3, reps:'10', descanso:60 };
  renderSheet();
}

function ajustarSeries(delta){
  sheet.series = Math.max(1, sheet.series + delta);
  document.getElementById('input-series').value = sheet.series;
}
function ajustarDescanso(delta){
  sheet.descanso = Math.max(0, sheet.descanso + delta);
  document.getElementById('input-descanso').value = sheet.descanso + 's';
}
function ajustarReps(delta){
  let atual = parseInt(sheet.reps, 10);
  if(isNaN(atual)) atual = 8;
  sheet.reps = String(Math.max(1, atual + delta));
  renderSheet();
}
function usarRepsMax(){
  sheet.reps = sheet.reps === 'máx' ? '8' : 'máx';
  renderSheet();
}

function salvarSheet(){
  const nomeFinal = (sheet.nome || '').trim();
  if(!nomeFinal){ showToast('Digite um nome para o exercício'); return; }

  const plano = getPlano();
  const d = plano.dias.find(x=>x.key===diaConfigKey);
  const exercicios = getExercicios();

  if(sheet.novoExercicio){
    sheet.exercicioId = garantirExercicioPorNome(nomeFinal, exercicios);
    localStorage.setItem(STORAGE_KEYS.exercicios, JSON.stringify(exercicios));
  } else {
    const ex = exercicios.find(e => e.id === sheet.exercicioId);
    if(ex && ex.nome !== nomeFinal){
      ex.nome = nomeFinal;
      localStorage.setItem(STORAGE_KEYS.exercicios, JSON.stringify(exercicios));
    }
  }

  if(sheet.itemId){
    const item = d.exercicios.find(x=>x.itemId===sheet.itemId);
    item.series = sheet.series; item.reps = sheet.reps; item.descanso = sheet.descanso;
  } else {
    d.exercicios.push({ itemId:generateId(), exercicioId:sheet.exercicioId, series:sheet.series, reps:sheet.reps, descanso:sheet.descanso });
  }

  salvarPlano(plano);
  fecharSheet();
  renderConfigDia();
  showToast('Exercício salvo');
}

function exportData(){
  const backup = {
    app:'log-de-treino',
    exportedAt:new Date().toISOString(),
    exercicios: getExercicios(),
    plano: getPlano(),
    logs: getLogs()
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `treino-backup-${todayISO()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
  showToast('Backup gerado');
}

function importData(event){
  const file = event.target.files[0];
  event.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      const exercicios = getExercicios();
      let novosLogs = [];

      if(parsed.data && typeof parsed.data === 'object'){
        Object.keys(parsed.data).forEach(sessionKey=>{
          const m = /^session_[a-z]+_(\d{4}-\d{2}-\d{2})$/.exec(sessionKey);
          if(!m) return;
          const data = m[1];
          const registro = parsed.data[sessionKey];
          Object.keys(registro).forEach(nome=>{
            const val = registro[nome];
            if(!val || (!val.peso && !val.reps)) return;
            const exercicioId = garantirExercicioPorNome(nome, exercicios);
            novosLogs.push({ id:generateId(), data, exercicioId, peso: val.peso || null, reps: val.reps || null });
          });
        });
      }

      if(Array.isArray(parsed.logs)){
        (parsed.exercicios || []).forEach(ex=>{
          if(!exercicios.find(e => e.id === ex.id)) exercicios.push(ex);
        });
        parsed.logs.forEach(l => novosLogs.push(l));
      }

      if(novosLogs.length === 0){
        showToast('Nenhum treino encontrado no arquivo');
        return;
      }

      const ok = confirm(`Encontrados ${novosLogs.length} registro(s) neste arquivo. Isso vai atualizar/adicionar esses treinos aos dados já salvos neste aparelho. Deseja continuar?`);
      if(!ok) return;

      let logs = getLogs();
      novosLogs.forEach(novo=>{
        const i = logs.findIndex(l => l.exercicioId === novo.exercicioId && l.data === novo.data);
        if(i !== -1) logs[i] = { ...logs[i], ...novo }; else logs.push(novo);
      });

      localStorage.setItem(STORAGE_KEYS.exercicios, JSON.stringify(exercicios));
      salvarLogs(logs);
      if(parsed.plano && !localStorage.getItem(STORAGE_KEYS.plano)){
        localStorage.setItem(STORAGE_KEYS.plano, JSON.stringify(parsed.plano));
      }

      showToast('Dados importados');
      renderCards();
    }catch(e){
      showToast('Arquivo inválido');
    }
  };
  reader.onerror = () => showToast('Erro ao ler arquivo');
  reader.readAsText(file);
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 1600);
}

function init(){
  renderTabs();
  renderCards();
}

aplicarCoresAtuais();
migrarDadosAntigos();
garantirPlanoAtualizado();
document.getElementById('confirm-ok-btn').onclick = () => {
  const cb = confirmCallback;
  fecharConfirm();
  if(cb) cb();
};
document.getElementById('dateInput').value = todayISO();
document.getElementById('dateInput').addEventListener('change', loadExistingForDate);
init();
</script>
