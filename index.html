<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Log de Treino</title>
<style>
  :root{
    --bg:#0b1424;
    --panel:#111c30;
    --panel-2:#16233b;
    --line:#233252;
    --text:#eef1f6;
    --sub:#8fa0bd;
    --accent:#1e9e6b;
    --ok:#2fbf71;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  .wrap{max-width:520px; margin:0 auto; padding:16px 14px 90px;}
  header{padding:6px 2px 14px;}
  .kicker{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:700;}
  h1{font-size:22px; margin:4px 0 0; font-weight:800;}
  .tabs{display:flex; gap:6px; margin:16px 0 14px; overflow-x:auto;}
  .tab{flex:1; text-align:center; padding:10px 6px; border-radius:10px; background:var(--panel);
    border:1px solid var(--line); font-size:13px; font-weight:700; color:var(--sub); cursor:pointer; white-space:nowrap;}
  .tab.active{background:var(--accent); color:#07140d; border-color:var(--accent);}
  .datebar{display:flex; align-items:center; justify-content:space-between; background:var(--panel);
    border:1px solid var(--line); border-radius:12px; padding:10px 14px; margin-bottom:14px;}
  .datebar input{background:transparent; border:none; color:var(--text); font-size:15px; font-weight:700; font-family:inherit;}
  .datebar label{font-size:11px; color:var(--sub); text-transform:uppercase; letter-spacing:.08em; display:block; margin-bottom:2px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px;}
  .ex-name{font-size:15px; font-weight:800; margin:0 0 2px;}
  .ex-scheme{font-size:12px; color:var(--sub); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; margin-bottom:10px;}
  .row{display:flex; gap:8px;}
  .field{flex:1;}
  .field label{font-size:10px; color:var(--sub); text-transform:uppercase; letter-spacing:.06em; display:block; margin-bottom:4px;}
  .field input{width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:9px;
    color:var(--text); font-size:17px; font-weight:700; padding:10px 10px; font-family:inherit;}
  .field input:focus{outline:none; border-color:var(--accent);}
  .hist{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); font-size:12px; color:var(--sub);
    display:flex; gap:10px; flex-wrap:wrap;}
  .hist b{color:var(--text);}
  .savebar{position:fixed; left:0; right:0; bottom:0; padding:12px 14px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--bg) 60%, transparent);}
  .savebtn{max-width:520px; margin:0 auto; display:block; width:100%; background:var(--accent); color:#07140d;
    border:none; border-radius:14px; padding:15px; font-size:15px; font-weight:800;}
  .savebtn.saved{background:var(--ok);}
  .toast{position:fixed; top:14px; left:50%; transform:translateX(-50%); background:var(--panel-2);
    border:1px solid var(--line); padding:8px 16px; border-radius:20px; font-size:13px; opacity:0; transition:opacity .25s; pointer-events:none;}
  .toast.show{opacity:1;}
  .reset{text-align:center; margin-top:18px;}
  .reset button{background:none; border:none; color:var(--sub); font-size:12px; text-decoration:underline;}
  .empty{font-size:12px; color:var(--sub); text-align:center; padding:6px;}
  .backup{display:flex; gap:10px; justify-content:center; margin-top:10px; flex-wrap:wrap;}
  .backup button{background:var(--panel); border:1px solid var(--line); color:var(--sub);
    font-size:12px; font-weight:700; padding:8px 14px; border-radius:10px;}
  .ultimo{font-size:14px; font-weight:800; color:var(--ok); background:var(--panel-2);
    border-radius:8px; padding:6px 10px; display:inline-block; margin-bottom:10px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">Log de treino</div>
    <h1 id="dayTitle">Segunda</h1>
  </header>

  <div class="tabs" id="tabs"></div>

  <div class="datebar">
    <div>
      <label>Data do treino</label>
      <input type="date" id="dateInput">
    </div>
  </div>

  <div id="cards"></div>

  <div class="reset">
    <button onclick="resetDay()">Limpar campos desta tela</button>
  </div>

  <div class="backup">
    <button onclick="exportData()">Exportar dados</button>
    <button onclick="document.getElementById('importFile').click()">Importar dados</button>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="importData(event)">
  </div>
</div>

<div class="savebar">
  <button class="savebtn" id="saveBtn" onclick="saveSession()">Salvar treino de hoje</button>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEYS = { exercicios:'treino_exercicios', plano:'treino_plano', logs:'treino_logs', migrado:'treino_migrado_v2' };

// Usado só como ponto de partida da migração automática (Etapa 2a). Depois da
// migração, a fonte de verdade passa a ser STORAGE_KEYS.plano/.exercicios no localStorage.
const DIAS_SEED_MIGRACAO = [
  { key:'seg', label:'Segunda', exercises:[
    {name:'Remada curvada', scheme:'4 x 8'},
    {name:'Serrote', scheme:'3 x 10'},
    {name:'Face pull', scheme:'3 x 10'},
    {name:'Rosca direta Scott', scheme:'3 x 10'},
    {name:'Rosca unilateral polia baixa', scheme:'2 x 12'},
  ]},
  { key:'ter', label:'Terça', exercises:[
    {name:'Supino inclinado halteres', scheme:'3 x 8'},
    {name:'Peck deck', scheme:'3 x 12'},
    {name:'Desenvolvimento halteres', scheme:'3 x 8'},
    {name:'Elevação lateral', scheme:'3 x 15'},
    {name:'Tríceps cordinha', scheme:'4 x 12'},
  ]},
  { key:'qui', label:'Quinta', exercises:[
    {name:'Agachamento livre', scheme:'3 x 8'},
    {name:'Cadeira extensora unilateral', scheme:'3 x 12'},
    {name:'Stiff barra', scheme:'3 x 10'},
    {name:'Cadeira flexora unilateral em pé', scheme:'2 x 12'},
    {name:'Panturrilha em pé', scheme:'3 x 15'},
  ]},
  { key:'sex', label:'Sexta', exercises:[
    {name:'Barra fixa', scheme:'3 x máx'},
    {name:'Pull down', scheme:'2 x 10'},
    {name:'Posterior de ombro no cross', scheme:'3 x 12'},
    {name:'Elevação lateral (ângulo dif.)', scheme:'3 x 10'},
    {name:'Rosca martelo', scheme:'3 x 10'},
    {name:'Tríceps testa', scheme:'3 x 10'},
  ]},
];

let currentDayIdx = 0;

function todayISO(){
  const d = new Date();
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off*60000);
  return local.toISOString().slice(0,10);
}

function formatarData(iso){
  const [y,m,d] = iso.split('-');
  return `${d}/${m}`;
}

function generateId(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,10);
}

function getExercicios(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEYS.exercicios)) || []; }catch(e){ return []; }
}
function getPlano(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEYS.plano)) || { dias: [] }; }catch(e){ return { dias: [] }; }
}
function getLogs(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEYS.logs)) || []; }catch(e){ return []; }
}
function salvarLogs(logs){ localStorage.setItem(STORAGE_KEYS.logs, JSON.stringify(logs)); }
function nomeDoExercicio(exercicioId, exercicios){
  const ex = exercicios.find(e => e.id === exercicioId);
  return ex ? ex.nome : '(exercício removido)';
}
function garantirExercicioPorNome(nome, exercicios){
  let ex = exercicios.find(e => e.nome === nome);
  if(!ex){
    ex = { id: generateId(), nome };
    exercicios.push(ex);
  }
  return ex.id;
}
function parseScheme(scheme){
  const m = /^(\d+)\s*x\s*(.+)$/i.exec(scheme || '');
  if(!m) return { series:null, reps: scheme || null, descanso:null };
  return { series: parseInt(m[1],10), reps: m[2].trim(), descanso:null };
}

function migrarDadosAntigos(){
  if(localStorage.getItem(STORAGE_KEYS.migrado)) return;

  const exercicios = [];

  const dias = DIAS_SEED_MIGRACAO.map(d => ({
    key: d.key,
    label: d.label,
    exercicios: d.exercises.map(ex => {
      const exercicioId = garantirExercicioPorNome(ex.name, exercicios);
      const parsed = parseScheme(ex.scheme);
      return { exercicioId, series: parsed.series, reps: parsed.reps, descanso: parsed.descanso };
    })
  }));

  const logs = [];
  Object.keys(localStorage).forEach(k=>{
    const m = /^session_([a-z]+)_(\d{4}-\d{2}-\d{2})$/.exec(k);
    if(!m) return;
    const data = m[2];
    try{
      const registro = JSON.parse(localStorage.getItem(k));
      Object.keys(registro).forEach(nome=>{
        const val = registro[nome];
        if(!val || (!val.peso && !val.reps)) return;
        const exercicioId = garantirExercicioPorNome(nome, exercicios);
        logs.push({ id: generateId(), data, exercicioId, peso: val.peso || null, reps: val.reps || null });
      });
    }catch(e){}
  });

  localStorage.setItem(STORAGE_KEYS.exercicios, JSON.stringify(exercicios));
  localStorage.setItem(STORAGE_KEYS.plano, JSON.stringify({ dias }));
  localStorage.setItem(STORAGE_KEYS.logs, JSON.stringify(logs));
  localStorage.setItem(STORAGE_KEYS.migrado, '1');
}

function renderTabs(){
  const plano = getPlano();
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  plano.dias.forEach((d,i)=>{
    const el = document.createElement('div');
    el.className = 'tab' + (i===currentDayIdx ? ' active' : '');
    el.textContent = d.label;
    el.onclick = ()=>{ currentDayIdx = i; init(); };
    tabs.appendChild(el);
  });
}

function renderCards(){
  const plano = getPlano();
  const exercicios = getExercicios();
  const logs = getLogs();
  const day = plano.dias[currentDayIdx];
  const container = document.getElementById('cards');

  if(!day){
    document.getElementById('dayTitle').textContent = '—';
    container.innerHTML = '<div class="empty">Nenhum dia configurado.</div>';
    return;
  }

  document.getElementById('dayTitle').textContent = day.label;
  container.innerHTML = '';

  day.exercicios.forEach((item, idx)=>{
    const nome = nomeDoExercicio(item.exercicioId, exercicios);
    const historico = logs
      .filter(l => l.exercicioId === item.exercicioId && l.peso)
      .sort((a,b) => b.data.localeCompare(a.data));
    const ultimo = historico[0];
    const anteriores = historico.slice(1, 4);
    const schemeTxt = `${item.series ?? '?'} x ${item.reps ?? '?'}` + (item.descanso ? ` · descanso ${item.descanso}` : '');

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <p class="ex-name">${nome}</p>
      <p class="ex-scheme">${schemeTxt}</p>
      ${ultimo ? `<div class="ultimo">Último: <b>${ultimo.peso}kg</b> (${formatarData(ultimo.data)})</div>` : ''}
      <div class="row">
        <div class="field">
          <label>Peso (kg)</label>
          <input type="number" inputmode="decimal" step="0.5" id="peso_${idx}" placeholder="—">
        </div>
        <div class="field">
          <label>Reps feitas</label>
          <input type="number" inputmode="numeric" id="reps_${idx}" placeholder="—">
        </div>
      </div>
      ${anteriores.length ? `<div class="hist">${anteriores.map(h=>`<span><b>${h.peso}kg</b> em ${formatarData(h.data)}</span>`).join('')}</div>` : ''}
    `;
    container.appendChild(card);
  });

  loadExistingForDate();
}

function loadExistingForDate(){
  const plano = getPlano();
  const day = plano.dias[currentDayIdx];
  if(!day) return;
  const date = document.getElementById('dateInput').value;
  const logs = getLogs();
  day.exercicios.forEach((item, idx)=>{
    const registro = logs.find(l => l.exercicioId === item.exercicioId && l.data === date);
    const pesoEl = document.getElementById(`peso_${idx}`);
    const repsEl = document.getElementById(`reps_${idx}`);
    if(pesoEl) pesoEl.value = registro && registro.peso ? registro.peso : '';
    if(repsEl) repsEl.value = registro && registro.reps ? registro.reps : '';
  });
}

function saveSession(){
  const plano = getPlano();
  const day = plano.dias[currentDayIdx];
  const date = document.getElementById('dateInput').value;
  if(!date){ showToast('Escolha uma data primeiro'); return; }
  if(!day) return;
  const btn = document.getElementById('saveBtn');
  try{
    let logs = getLogs();
    day.exercicios.forEach((item, idx)=>{
      const peso = document.getElementById(`peso_${idx}`).value;
      const reps = document.getElementById(`reps_${idx}`).value;
      const existenteIdx = logs.findIndex(l => l.exercicioId === item.exercicioId && l.data === date);
      if(!peso && !reps){
        if(existenteIdx !== -1) logs.splice(existenteIdx, 1);
        return;
      }
      const registro = { id: existenteIdx !== -1 ? logs[existenteIdx].id : generateId(), data:date, exercicioId:item.exercicioId, peso: peso || null, reps: reps || null };
      if(existenteIdx !== -1) logs[existenteIdx] = registro; else logs.push(registro);
    });
    salvarLogs(logs);
    btn.textContent = 'Salvo ✓';
    btn.classList.add('saved');
    showToast('Treino salvo');
    setTimeout(()=>{ btn.textContent = 'Salvar treino de hoje'; btn.classList.remove('saved'); renderCards(); }, 1200);
  }catch(e){
    showToast('Erro ao salvar');
  }
}

function resetDay(){
  const plano = getPlano();
  const day = plano.dias[currentDayIdx];
  if(!day) return;
  day.exercicios.forEach((item, idx)=>{
    document.getElementById(`peso_${idx}`).value = '';
    document.getElementById(`reps_${idx}`).value = '';
  });
}

function exportData(){
  const backup = {
    app:'log-de-treino',
    exportedAt:new Date().toISOString(),
    exercicios: getExercicios(),
    plano: getPlano(),
    logs: getLogs()
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `treino-backup-${todayISO()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
  showToast('Backup gerado');
}

function importData(event){
  const file = event.target.files[0];
  event.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      const exercicios = getExercicios();
      let novosLogs = [];

      if(parsed.data && typeof parsed.data === 'object'){
        Object.keys(parsed.data).forEach(sessionKey=>{
          const m = /^session_[a-z]+_(\d{4}-\d{2}-\d{2})$/.exec(sessionKey);
          if(!m) return;
          const data = m[1];
          const registro = parsed.data[sessionKey];
          Object.keys(registro).forEach(nome=>{
            const val = registro[nome];
            if(!val || (!val.peso && !val.reps)) return;
            const exercicioId = garantirExercicioPorNome(nome, exercicios);
            novosLogs.push({ id:generateId(), data, exercicioId, peso: val.peso || null, reps: val.reps || null });
          });
        });
      }

      if(Array.isArray(parsed.logs)){
        (parsed.exercicios || []).forEach(ex=>{
          if(!exercicios.find(e => e.id === ex.id)) exercicios.push(ex);
        });
        parsed.logs.forEach(l => novosLogs.push(l));
      }

      if(novosLogs.length === 0){
        showToast('Nenhum treino encontrado no arquivo');
        return;
      }

      const ok = confirm(`Encontrados ${novosLogs.length} registro(s) neste arquivo. Isso vai atualizar/adicionar esses treinos aos dados já salvos neste aparelho. Deseja continuar?`);
      if(!ok) return;

      let logs = getLogs();
      novosLogs.forEach(novo=>{
        const i = logs.findIndex(l => l.exercicioId === novo.exercicioId && l.data === novo.data);
        if(i !== -1) logs[i] = { ...logs[i], ...novo }; else logs.push(novo);
      });

      localStorage.setItem(STORAGE_KEYS.exercicios, JSON.stringify(exercicios));
      salvarLogs(logs);
      if(parsed.plano && !localStorage.getItem(STORAGE_KEYS.plano)){
        localStorage.setItem(STORAGE_KEYS.plano, JSON.stringify(parsed.plano));
      }

      showToast('Dados importados');
      renderCards();
    }catch(e){
      showToast('Arquivo inválido');
    }
  };
  reader.onerror = () => showToast('Erro ao ler arquivo');
  reader.readAsText(file);
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 1600);
}

function init(){
  renderTabs();
  renderCards();
}

migrarDadosAntigos();
document.getElementById('dateInput').value = todayISO();
document.getElementById('dateInput').addEventListener('change', loadExistingForDate);
init();
</script>
</body>
</html>
